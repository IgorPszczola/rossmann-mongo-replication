version: '3.8'

services:
  mongodb:
    image: mongo:7.0.11
    container_name: rossmann_mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=rossmann_db
    volumes:
      - mongo_data:/data/db

  mongo-init-replica:
    image: mongo:7.0.11
    container_name: rossmann_mongo_init
    depends_on:
      - mongodb
    entrypoint: [ "/bin/sh", "-c", "sleep 5 && mongosh --host mongodb:27017 --eval \"rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]})\"" ]

  python-app:
    build: .
    container_name: rossmann_generator
    depends_on:
      - mongodb

  python-listener:
    build: .
    container_name: rossmann_listener
    depends_on:
      - mongodb
      - mongodb-backup
      - postgres
    command: ["python", "-u", "pipeline.py"]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=rossmann_relational_db
      - POSTGRES_USER=rossmann_user
      - POSTGRES_PASSWORD=rossmann_password
      - REPLICATION_MAX_RETRIES=3
      - OFFSET_MAX_RETRIES=0
      - DEAD_LETTER_QUEUE_PATH=/app/data/dead_letter_queue.jsonl
      - FILE_ARCHIVE_PATH=/app/data/replication_events.jsonl
    volumes:
      - ./data:/app/data

  postgres:
    image: postgres:16-alpine
    container_name: rossmann_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rossmann_user
      POSTGRES_PASSWORD: rossmann_password
      POSTGRES_DB: rossmann_relational_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d

  # MONGODB (BACKUP)
  mongodb-backup:
    image: mongo:7.0.11
    container_name: rossmann_mongo_backup
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=rossmann_backup_db
    volumes:
      - mongo_backup_data:/data/db

volumes:
  mongo_data:
  mongo_backup_data:
  postgres_data:
