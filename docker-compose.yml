services:
  mongodb:
    image: mongo:7.0.11
    container_name: rossmann_mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=rossmann_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 2s
      retries: 30

  mongo-init-replica:
    image: mongo:7.0.11
    container_name: rossmann_mongo_init
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mongosh --host mongodb:27017 --quiet --eval "
          try {
            if (rs.status().ok) quit(0);
          } catch (statusError) {
            const config = db.getSiblingDB('local').system.replset.findOne();
            if (config) {
              config.members[0].host = 'mongodb:27017';
              try {
                if (rs.reconfig(config, {force: true}).ok) quit(0);
              } catch (reconfigError) {}
            } else {
              try {
                if (rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}).ok) quit(0);
              } catch (initError) {}
            }
          }
          quit(1);
        "; do
          sleep 2;
        done

  python-app:
    build: .
    container_name: rossmann_generator
    depends_on:
      python-listener:
        condition: service_healthy

  python-listener:
    build: .
    container_name: rossmann_listener
    depends_on:
      mongo-init-replica:
        condition: service_completed_successfully
      mongodb-backup:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-u", "pipeline.py"]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=rossmann_relational_db
      - POSTGRES_USER=rossmann_user
      - POSTGRES_PASSWORD=rossmann_password
      - REPLICATION_MAX_RETRIES=3
      - OFFSET_MAX_RETRIES=0
      - DEAD_LETTER_QUEUE_PATH=/app/data/dead_letter_queue.jsonl
      - FILE_ARCHIVE_PATH=/app/data/replication_events.jsonl
      - LISTENER_READY_FILE=/tmp/rossmann-listener-ready
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/rossmann-listener-ready"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:16-alpine
    container_name: rossmann_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rossmann_user
      POSTGRES_PASSWORD: rossmann_password
      POSTGRES_DB: rossmann_relational_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rossmann_user -d rossmann_relational_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  # MONGODB (BACKUP)
  mongodb-backup:
    image: mongo:7.0.11
    container_name: rossmann_mongo_backup
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=rossmann_backup_db
    volumes:
      - mongo_backup_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 2s
      retries: 30

  # REDIS (CACHE)
  redis:
    image: redis:7.2-alpine
    container_name: rossmann_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  mongo_data:
  mongo_backup_data:
  postgres_data:
